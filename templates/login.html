{% extends "base.html" %}

{% block title %}Login - NaijaMeal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <div class="feature-icon mx-auto"><i class="bi bi-box-arrow-in-right"></i></div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted">Sign in to your meal planner</p>
                </div>
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-lg" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Sign In</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold" style="color: var(--primary-green);">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
