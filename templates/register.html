{% extends "base.html" %}

{% block title %}Register - NaijaMeal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <div class="feature-icon mx-auto"><i class="bi bi-person-plus"></i></div>
                    <h3 class="fw-bold">Create Account</h3>
                    <p class="text-muted">Set up your personalized meal planner</p>
                </div>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" name="full_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Household Size</label>
                            <input type="number" name="household_size" class="form-control" value="1" min="1">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Calorie Limit / Meal</label>
                            <input type="number" name="calorie_limit" class="form-control" value="800" min="100">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Dietary Preference</label>
                            <select name="dietary_preference" class="form-select">
                                <option value="">None</option>
                                <option value="vegetarian">Vegetarian</option>
                                <option value="low-carb">Low-Carb</option>
                                <option value="high-protein">High-Protein</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Health Conditions</label>
                        <input type="text" name="health_conditions" class="form-control" placeholder="e.g., diabetes, hypertension (comma-separated)">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Allergies</label>
                        <input type="text" name="allergies" class="form-control" placeholder="e.g., groundnuts, seafood (comma-separated)">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Create Account</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold" style="color: var(--primary-green);">Sign in</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
